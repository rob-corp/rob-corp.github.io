<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f172a">
<title>Buscador de Cupones</title>
<link rel="icon" type="image/svg+xml" href="iconos/cupones.svg">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          slate: {
            600: '#475569',
            700: '#334155',
            800: '#334155',
            850: '#1e293b',
            900: '#1e293b',
            950: '#0f172a'
          },
          cyan: {
            300: '#93c5fd',
            400: '#60a5fa',
            500: '#3b82f6',
            600: '#2563eb',
            700: '#1d4ed8'
          }
        }
      }
    }
  };
</script>

<style>
  /* Reseteo estricto de UI táctil y de foco */
  *, *::before, *::after, a, button, input { 
      -webkit-tap-highlight-color: transparent !important; 
  }
  :focus { outline: none !important; box-shadow: none !important; }
  :focus-visible { outline: none !important; box-shadow: none !important; }
  html { -webkit-text-size-adjust: 100%; }

  /* Scrollbars - Tema Oscuro */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Toasts Animaciones */
  .toast-popup { transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
  .toast-hidden { transform: translateY(1rem) scale(0.95); opacity: 0; pointer-events: none; }
  .toast-visible { transform: translateY(0) scale(1); opacity: 1; }

  /* Botones de Categoría */
  .cat-btn.active {
      background-color: rgba(59, 130, 246, 0.15);
      border-color: #3b82f6;
      color: #93c5fd;
  }
</style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-white flex flex-col">

<!-- ==================== HEADER ==================== -->
<header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
    <a href="index.html" class="flex items-center space-x-3 group p-1 rounded-lg min-w-0">
      <div class="relative flex items-center justify-center w-8 h-8 rounded-lg bg-slate-950 border border-cyan-500/40 group-hover:border-cyan-400 group-hover:shadow-[0_0_12px_rgba(59,130,246,0.4)] transition-all flex-shrink-0">
        <img src="iconos/cupones.svg" alt="Cupones" class="w-4 h-4 object-contain filter drop-shadow-[0_0_5px_rgba(59,130,246,0.6)]" 
             onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2360a5fa\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'M21.5 12H16c-.7 2-3 3-4.5 1.5S10 9 12 8c2-1 3 1.5 4.5 1.5h5\'/><path d=\'M2.5 12h5.5c.7-2 3-3 4.5-1.5S14 15 12 16c-2 1-3-1.5-4.5-1.5H2.5\'/></svg>';">
      </div>
      <h1 class="text-lg sm:text-2xl font-extrabold text-white tracking-tight group-hover:text-cyan-300 transition-colors truncate">
        Buscador de Cupones
      </h1>
    </a>
  </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

  <!-- ==================== FILTROS Y BÚSQUEDA ==================== -->
  <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl space-y-4">
    <div class="flex flex-col md:flex-row gap-4">
      
      <!-- Buscador -->
      <div class="relative flex-1">
        <label for="search-input" class="sr-only">Buscar cupón</label>
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
        </div>
        <input type="text" id="search-input" placeholder="Buscar por tienda, producto o código..." 
               class="w-full bg-slate-950 border border-slate-800 focus:border-cyan-500 rounded-2xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 transition-all shadow-inner">
      </div>

      <!-- Select de Tienda (Custom Dropdown) -->
      <div class="relative md:w-72 shrink-0">
        <button type="button" id="btn-dropdown-store" class="w-full bg-slate-950 border border-slate-800 hover:border-slate-700 focus:border-cyan-500 rounded-2xl px-4 py-2.5 text-sm text-slate-200 flex items-center justify-between transition-all shadow-inner">
          <span id="label-dropdown-store" class="truncate font-semibold text-slate-300">Todas las Tiendas</span>
          <i class="fa-solid fa-chevron-down text-slate-400 text-[11px] transition-transform duration-200" id="icon-dropdown-store"></i>
        </button>
        <!-- Menú desplegable -->
        <div id="menu-dropdown-store" class="hidden absolute top-full left-0 right-0 mt-2 z-50 bg-slate-900 border border-slate-800 rounded-2xl p-1.5 shadow-2xl max-h-60 overflow-y-auto">
          <!-- Opciones inyectadas por JS -->
        </div>
      </div>

    </div>

    <!-- Categorías Horizontales -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-2 pb-1 border-t border-slate-800/80">
        <button data-cat="all" class="cat-btn active px-4 py-2 rounded-xl border border-transparent bg-slate-950 text-slate-300 hover:text-white font-bold text-xs whitespace-nowrap transition-all shadow-sm">
            <i class="fa-solid fa-border-all mr-1.5"></i>Todos
        </button>
        <button data-cat="E-commerce LatAm" class="cat-btn px-4 py-2 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 hover:text-white font-semibold text-xs whitespace-nowrap transition-all shadow-sm">
            <i class="fa-solid fa-cart-shopping mr-1.5"></i>E-commerce LatAm
        </button>
        <button data-cat="Retail & Electrodomésticos" class="cat-btn px-4 py-2 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 hover:text-white font-semibold text-xs whitespace-nowrap transition-all shadow-sm">
            <i class="fa-solid fa-tv mr-1.5"></i>Retail & Electro
        </button>
        <button data-cat="Electrónica & 3D" class="cat-btn px-4 py-2 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 hover:text-white font-semibold text-xs whitespace-nowrap transition-all shadow-sm">
            <i class="fa-solid fa-microchip mr-1.5"></i>Electrónica & 3D
        </button>
        <button data-cat="Software" class="cat-btn px-4 py-2 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 hover:text-white font-semibold text-xs whitespace-nowrap transition-all shadow-sm">
            <i class="fa-solid fa-laptop-code mr-1.5"></i>Software
        </button>
    </div>
  </section>

  <!-- ==================== RESULTADOS ==================== -->
  <section class="space-y-4">
    <div class="flex justify-between items-end border-b border-slate-800 pb-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Cupones Disponibles</h2>
      <span id="results-count" class="text-xs font-mono text-cyan-400 font-bold bg-cyan-900/30 px-2.5 py-1 rounded-lg border border-cyan-800/50">0</span>
    </div>

    <!-- Grid de Tarjetas -->
    <div id="coupons-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Renderizado vía JS -->
    </div>

    <!-- Estado Vacío -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 bg-slate-900 border border-slate-800 rounded-2xl space-y-4 text-center">
        <i class="fa-solid fa-ticket-simple text-4xl text-slate-600"></i>
        <div>
            <h3 class="text-sm font-bold text-slate-200">No se encontraron resultados</h3>
            <p class="text-xs text-slate-400 mt-1 max-w-xs mx-auto">No hay cupones que coincidan con tu búsqueda o filtros actuales.</p>
        </div>
        <button id="btn-reset" class="mt-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 font-bold px-4 py-2 rounded-xl text-xs transition-all shadow-sm border border-slate-700">
            Limpiar Filtros
        </button>
    </div>
  </section>

</main>

<!-- Toasts -->
<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none" aria-live="polite" aria-atomic="false"></div>

<script>
(() => {
'use strict';

/* =========================================================
   BASE DE DATOS DE CUPONES
   ========================================================= */
const DB = [
    // E-commerce LatAm
    { store: 'Mercado Libre', cat: 'E-commerce LatAm', title: '20% OFF en Tecnología', code: 'MELITEC20', desc: 'Descuento tope de $15.000 pagando con Mercado Pago.', discount: '20% OFF' },
    { store: 'Mercado Libre', cat: 'E-commerce LatAm', title: 'Envíos Full Gratis', code: 'FULLFREE24', desc: 'Aplica a carritos superiores a $20.000 en productos Full.', discount: 'Envío Gratis' },
    { store: 'TiendaMia', cat: 'E-commerce LatAm', title: 'Cupón Primera Compra', code: 'MIA15NEW', desc: 'Descuento de 15 USD en tu primera orden internacional.', discount: '$15 USD' },
    { store: 'Amazon', cat: 'E-commerce LatAm', title: 'Envío Gratis a LatAm', code: 'AMZFREE', desc: 'Para productos seleccionados en compras mayores a $49.', discount: 'Envío Gratis' },
    { store: 'AliExpress', cat: 'E-commerce LatAm', title: 'Descuento Global Choice', code: 'ALICHOICE12', desc: 'Descuento en productos Choice con envío rápido garantizado.', discount: '$12 OFF' },
    
    // Retail & Electrodomésticos
    { store: 'Musimundo', cat: 'Retail & Electrodomésticos', title: '15% en Climatización', code: 'MUSI15CLIMA', desc: 'Aires acondicionados y ventilación. Solo pago contado.', discount: '15% OFF' },
    { store: 'Musimundo', cat: 'Retail & Electrodomésticos', title: 'Envío Bonificado', code: 'MUSIENVIO', desc: 'Envío gratis en CABA y GBA para línea blanca.', discount: 'Envío Gratis' },
    { store: 'Frávega', cat: 'Retail & Electrodomésticos', title: '10% en Celulares', code: 'FRAVEGA10M', desc: 'Descuento en smartphones Samsung y Motorola liberados.', discount: '10% OFF' },
    { store: 'Megatone', cat: 'Retail & Electrodomésticos', title: 'Hasta 18 Cuotas Sin Interés', code: 'MEGA18CSI', desc: 'Aplica a Smart TVs seleccionados pagando con tarjetas bancarias.', discount: '18 Cuotas' },
    { store: 'Cetrogar', cat: 'Retail & Electrodomésticos', title: 'Descuento Especial Notebooks', code: 'CETROPC20', desc: '20% de descuento en notebooks HP y Lenovo.', discount: '20% OFF' },
    
    // Electrónica & 3D
    { store: 'Creality', cat: 'Electrónica & 3D', title: '15% en Filamentos', code: 'CREA15FIL', title: 'Hyper PLA y PETG', desc: 'Comprando 3 bobinas o más en la tienda oficial.', discount: '15% OFF' },
    { store: 'Creality', cat: 'Electrónica & 3D', title: 'K1 Series Promo', code: 'CR50K1', desc: 'Descuento directo al comprar cualquier impresora de la serie K1.', discount: '$50 USD' },
    { store: 'Arduino Store', cat: 'Electrónica & 3D', title: 'Descuento para Makers', code: 'MAKER10', desc: 'Toda la familia UNO R4 y accesorios originales.', discount: '10% OFF' },
    
    // Software
    { store: 'Udemy', cat: 'Software', title: 'Cursos a $9.99', code: 'UDEMYDEV24', desc: 'Acceso a cursos de programación web y hardware a precio mínimo.', discount: '$9.99 USD' },
    { store: 'Udemy', cat: 'Software', title: '20% OFF Extra', code: 'LEARN20', desc: 'Descuento adicional en tu carrito de compras final.', discount: '20% OFF' }
];

/* =========================================================
   ESTADO Y ELEMENTOS DOM
   ========================================================= */
let state = {
    search: '',
    store: 'all',
    category: 'all'
};

const dom = {
    inputSearch: document.getElementById('search-input'),
    btnDropdownStore: document.getElementById('btn-dropdown-store'),
    menuDropdownStore: document.getElementById('menu-dropdown-store'),
    labelDropdownStore: document.getElementById('label-dropdown-store'),
    iconDropdownStore: document.getElementById('icon-dropdown-store'),
    catButtons: document.querySelectorAll('.cat-btn'),
    grid: document.getElementById('coupons-grid'),
    emptyState: document.getElementById('empty-state'),
    count: document.getElementById('results-count'),
    btnReset: document.getElementById('btn-reset'),
    toastBox: document.getElementById('toast-container')
};

/* =========================================================
   INICIALIZACIÓN DE DROPDOWN PERSONALIZADO
   ========================================================= */
function initStoreDropdown() {
    // Extraer tiendas únicas
    const stores = [...new Set(DB.map(c => c.store))].sort((a, b) => a.localeCompare(b));
    
    // Crear opción 'Todas'
    let html = `<button type="button" data-val="all" class="store-opt w-full text-left px-3 py-2.5 text-xs font-bold text-cyan-300 bg-cyan-950/80 border border-cyan-500/30 rounded-xl transition-colors">Todas las Tiendas</button>`;
    
    // Crear botones para cada tienda
    stores.forEach(s => {
        html += `<button type="button" data-val="${s}" class="store-opt w-full text-left px-3 py-2.5 text-xs font-medium text-slate-200 hover:bg-slate-800 hover:text-white rounded-xl transition-colors mt-1">${s}</button>`;
    });
    
    dom.menuDropdownStore.innerHTML = html;

    // Lógica de apertura/cierre
    dom.btnDropdownStore.addEventListener('click', (e) => {
        e.stopPropagation();
        const isHidden = dom.menuDropdownStore.classList.toggle('hidden');
        dom.iconDropdownStore.classList.toggle('rotate-180', !isHidden);
        dom.btnDropdownStore.classList.toggle('border-cyan-500', !isHidden);
    });

    // Lógica de selección
    dom.menuDropdownStore.querySelectorAll('.store-opt').forEach(opt => {
        opt.addEventListener('click', (e) => {
            e.stopPropagation();
            state.store = opt.dataset.val;
            dom.labelDropdownStore.textContent = opt.textContent;
            
            // Actualizar estilos del dropdown
            dom.menuDropdownStore.querySelectorAll('.store-opt').forEach(o => {
                o.className = "store-opt w-full text-left px-3 py-2.5 text-xs font-medium text-slate-200 hover:bg-slate-800 hover:text-white rounded-xl transition-colors mt-1";
            });
            opt.className = "store-opt w-full text-left px-3 py-2.5 text-xs font-bold text-cyan-300 bg-cyan-950/80 border border-cyan-500/30 rounded-xl transition-colors mt-1";
            
            dom.menuDropdownStore.classList.add('hidden');
            dom.iconDropdownStore.classList.remove('rotate-180');
            dom.btnDropdownStore.classList.remove('border-cyan-500');
            
            renderCoupons();
        });
    });

    // Cerrar al hacer clic fuera
    document.addEventListener('click', () => {
        dom.menuDropdownStore.classList.add('hidden');
        dom.iconDropdownStore.classList.remove('rotate-180');
        dom.btnDropdownStore.classList.remove('border-cyan-500');
    });
}

/* =========================================================
   LÓGICA DE RENDERIZADO Y FILTRADO
   ========================================================= */
function renderCoupons() {
    dom.grid.innerHTML = '';
    
    const filtered = DB.filter(c => {
        const matchSearch = state.search === '' || 
                            c.title.toLowerCase().includes(state.search) || 
                            c.desc.toLowerCase().includes(state.search) || 
                            c.store.toLowerCase().includes(state.search);
        
        const matchStore = state.store === 'all' || c.store === state.store;
        const matchCat = state.category === 'all' || c.cat === state.category;

        return matchSearch && matchStore && matchCat;
    });

    dom.count.textContent = filtered.length;

    if (filtered.length === 0) {
        dom.emptyState.classList.remove('hidden');
    } else {
        dom.emptyState.classList.add('hidden');
        filtered.forEach(c => dom.grid.appendChild(createCard(c)));
    }
}

function createCard(c) {
    const card = document.createElement('div');
    card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-5 flex flex-col justify-between h-full hover:border-slate-700 transition-colors shadow-lg";
    
    card.innerHTML = `
        <div class="space-y-3">
            <div class="flex items-start justify-between gap-2">
                <span class="text-[10px] sm:text-[11px] font-bold px-2 py-1 rounded-md bg-slate-950 border border-slate-800 text-slate-300 truncate">${c.store}</span>
                <span class="text-[11px] font-black text-cyan-400 font-mono tracking-tight bg-cyan-900/30 px-2 py-1 rounded-md border border-cyan-800/50 shrink-0">${c.discount}</span>
            </div>
            <div>
                <h4 class="text-sm font-bold text-white mb-1.5 leading-snug">${c.title}</h4>
                <p class="text-xs text-slate-400 leading-relaxed line-clamp-2">${c.desc}</p>
            </div>
        </div>
        
        <div class="pt-4 mt-4 border-t border-slate-800 flex items-center gap-2">
            <div class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-center font-mono text-[11px] font-bold text-cyan-400 truncate select-all">
                ${c.code}
            </div>
            <button type="button" class="btn-copy px-4 py-2 bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white font-bold text-[11px] sm:text-xs rounded-xl transition-all shadow-md shrink-0 flex items-center gap-1.5" data-code="${c.code}">
                <i class="fa-regular fa-copy"></i>
                <span class="hidden sm:inline">Copiar</span>
            </button>
        </div>
    `;

    // Asignar evento al botón de copiar de esta tarjeta
    card.querySelector('.btn-copy').addEventListener('click', (e) => {
        copyCode(c.code);
    });

    return card;
}

/* =========================================================
   EVENT LISTENER GENERALES
   ========================================================= */
function setupEvents() {
    // Buscador
    dom.inputSearch.addEventListener('input', (e) => {
        state.search = e.target.value.toLowerCase().trim();
        renderCoupons();
    });

    // Categorías
    dom.catButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            dom.catButtons.forEach(b => {
                b.className = "cat-btn px-4 py-2 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 hover:text-white font-semibold text-xs whitespace-nowrap transition-all shadow-sm";
            });
            btn.className = "cat-btn active px-4 py-2 rounded-xl border border-transparent bg-slate-950 text-slate-300 hover:text-white font-bold text-xs whitespace-nowrap transition-all shadow-sm";
            
            state.category = btn.dataset.cat;
            renderCoupons();
        });
    });

    // Botón Limpiar (Estado Vacío)
    dom.btnReset.addEventListener('click', () => {
        dom.inputSearch.value = '';
        state.search = '';
        
        // Reset Store
        state.store = 'all';
        dom.labelDropdownStore.textContent = 'Todas las Tiendas';
        dom.menuDropdownStore.querySelectorAll('.store-opt').forEach(o => {
            o.className = "store-opt w-full text-left px-3 py-2.5 text-xs font-medium text-slate-200 hover:bg-slate-800 hover:text-white rounded-xl transition-colors mt-1";
            if(o.dataset.val === 'all') o.className = "store-opt w-full text-left px-3 py-2.5 text-xs font-bold text-cyan-300 bg-cyan-950/80 border border-cyan-500/30 rounded-xl transition-colors mt-1";
        });

        // Reset Categoria
        document.querySelector('[data-cat="all"]').click();
    });
}

/* =========================================================
   PORTAPAPELES Y TOASTS
   ========================================================= */
async function copyCode(code) {
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(code);
        } else {
            const ta = document.createElement('textarea');
            ta.value = code;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
        }
        showToast(`Código <b>${code}</b> copiado`);
    } catch (_) {
        showToast('Error al copiar el código', 'warning');
    }
}

function showToast(msg, type = 'success') {
    const toast = document.createElement('div');
    const palette = type === 'warning'
        ? 'bg-amber-950/90 text-amber-200 border-amber-800'
        : 'bg-slate-900/95 text-slate-100 border-slate-700';

    toast.className = `toast-popup toast-hidden px-4 py-3 rounded-2xl shadow-2xl border text-xs sm:text-sm font-medium flex items-center space-x-2.5 ${palette}`;

    const icon = type === 'warning'
        ? '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>'
        : '<i class="fa-solid fa-circle-check text-cyan-400"></i>';

    toast.innerHTML = `${icon}<span>${msg}</span>`;
    dom.toastBox.appendChild(toast);

    requestAnimationFrame(() => {
        toast.classList.remove('toast-hidden');
        toast.classList.add('toast-visible');
    });

    setTimeout(() => {
        toast.classList.remove('toast-visible');
        toast.classList.add('toast-hidden');
        setTimeout(() => toast.remove(), 300);
    }, 2400);
}

/* =========================================================
   BOOT
   ========================================================= */
initStoreDropdown();
setupEvents();
renderCoupons();

})();
</script>
</body>
</html>
