<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f172a">
<title>Visualizador HTML</title>
<link rel="icon" type="image/svg+xml" href="/iconos/visualizador_html.svg">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        screens: { xs: '400px' },
        colors: {
          slate: {
            700: '#475569',
            800: '#334155',
            850: '#1e293b',
            900: '#1e293b',
            950: '#0f172a'
          },
          cyan: {
            300: '#93c5fd',
            400: '#60a5fa',
            500: '#3b82f6',
            600: '#2563eb',
            700: '#1d4ed8'
          }
        }
      }
    }
  };
</script>

<style>
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scrollbar-color: #334155 #0f172a; scrollbar-width: thin; }

  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid #3b82f6;
    outline-offset: 2px;
    border-radius: 8px;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* Editor de código personalizado */
  textarea.code-editor {
    tab-size: 2;
    -moz-tab-size: 2;
    font-family: 'Courier New', Courier, monospace;
    line-height: 1.5;
  }

  /* Toasts */
  .toast-popup { transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
  .toast-hidden { transform: translateY(1rem) scale(0.95); opacity: 0; pointer-events: none; }
  .toast-visible { transform: translateY(0) scale(1); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ESQB0M5W6R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ESQB0M5W6R');
</script>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-white flex flex-col">

<!-- HEADER -->
<header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 flex-shrink-0">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
    
    <!-- Aplicando el patrón de logo del Ejemplo 2 -->
    <a href="/index.html" class="flex items-center space-x-3 group p-1 rounded-lg min-w-0">
      <img src="/iconos/visualizador_html.svg" alt="Logo Código" class="w-7 h-7 object-contain transition-transform group-hover:scale-110 duration-200 drop-shadow-[0_0_8px_rgba(59,130,246,0.6)] flex-shrink-0" onerror="this.style.display='none'">
      <h1 class="text-lg sm:text-2xl font-extrabold text-white tracking-tight group-hover:text-cyan-300 transition-colors truncate">
        Visualizador HTML
      </h1>
    </a>

    <!-- Toggle Autorefresh -->
    <div class="flex items-center bg-slate-950 p-1.5 rounded-xl border border-slate-800 shadow-inner hidden sm:flex">
      <label class="flex items-center cursor-pointer space-x-2 px-2">
        <div class="relative">
          <input type="checkbox" id="toggle-autorefresh" class="sr-only" checked>
          <div class="block bg-slate-800 w-8 h-5 rounded-full border border-slate-700 transition-colors duration-300"></div>
          <div class="dot absolute left-1 top-1 bg-slate-400 w-3 h-3 rounded-full transition-transform duration-300"></div>
        </div>
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider select-none">Auto-Render</span>
      </label>
    </div>
  </div>
</header>

<!-- MAIN WORKSPACE -->
<main class="flex-1 max-w-[1600px] w-full mx-auto p-3 sm:p-4 grid grid-cols-1 lg:grid-cols-2 gap-4 h-[calc(100vh-4rem)]">
  
  <!-- EDITOR PANEL -->
  <section class="flex flex-col bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden h-full">
    <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800 bg-slate-900/50">
      <h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <i class="fa-solid fa-terminal text-cyan-500" aria-hidden="true"></i> Editor de Código
      </h2>
      <div class="flex space-x-2">
        <button type="button" id="btn-clear" class="p-1.5 text-slate-500 hover:text-rose-400 transition-colors" title="Limpiar código" aria-label="Limpiar código">
          <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
        </button>
        <button type="button" id="btn-copy" class="p-1.5 text-slate-500 hover:text-cyan-400 transition-colors" title="Copiar código" aria-label="Copiar código">
          <i class="fa-regular fa-copy" aria-hidden="true"></i>
        </button>
      </div>
    </div>
    
    <div class="flex-1 relative">
      <textarea id="html-editor" spellcheck="false" placeholder="<!-- Escribe tu HTML, CSS o JS aquí -->" 
        class="code-editor absolute inset-0 w-full h-full bg-slate-950 text-slate-200 p-4 resize-none border-none focus:ring-0 text-sm md:text-base outline-none selection:bg-cyan-500/30"></textarea>
    </div>
    
    <div class="p-3 border-t border-slate-800 bg-slate-950 sm:hidden">
       <button type="button" id="btn-force-render-mobile" class="w-full bg-cyan-600 hover:bg-cyan-500 active:bg-cyan-700 text-white font-bold py-2 rounded-xl text-xs transition-all shadow-md active:scale-95 flex items-center justify-center gap-2">
         <i class="fa-solid fa-play"></i> Renderizar
       </button>
    </div>
  </section>

  <!-- PREVIEW PANEL -->
  <section class="flex flex-col bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden h-[50vh] lg:h-full">
    <div class="flex items-center justify-between px-4 py-2 border-b border-slate-800 bg-slate-900/50">
      <h2 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <i class="fa-solid fa-eye text-emerald-400" aria-hidden="true"></i> Vista Previa
      </h2>
      
      <!-- Botón Pantalla Completa -->
      <button type="button" id="btn-fullscreen" class="p-1.5 text-slate-400 hover:text-cyan-400 transition-colors" title="Pantalla Completa" aria-label="Pantalla Completa">
        <i class="fa-solid fa-expand text-sm" aria-hidden="true"></i>
      </button>
    </div>
    
    <!-- El contenedor es blanco por defecto para renderizar HTML puro correctamente -->
    <div id="iframe-container" class="flex-1 bg-white relative">
      <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin" class="absolute inset-0 w-full h-full border-none bg-white"></iframe>
    </div>
  </section>

</main>

<div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none" aria-live="polite" aria-atomic="false"></div>

<style>
  /* Estilo para el toggle checkbox */
  #toggle-autorefresh:checked ~ .block { background-color: #0f172a; border-color: #3b82f6; }
  #toggle-autorefresh:checked ~ .dot { transform: translateX(100%); background-color: #3b82f6; box-shadow: 0 0 8px rgba(59,130,246,0.6); }
</style>

<script>
(() => {
'use strict';

const dom = {
  editor:          document.getElementById('html-editor'),
  iframe:          document.getElementById('preview-frame'),
  iframeContainer: document.getElementById('iframe-container'),
  btnClear:        document.getElementById('btn-clear'),
  btnCopy:         document.getElementById('btn-copy'),
  btnForceRender:  document.getElementById('btn-force-render-mobile'),
  toggleAuto:      document.getElementById('toggle-autorefresh'),
  btnFullscreen:   document.getElementById('btn-fullscreen'),
  toastBox:        document.getElementById('toast-container')
};

// Plantilla estructurada para evitar que el navegador la lea como etiquetas HTML reales y rompa el script
const defaultTemplate = [
  '<!DOCTYPE html>',
  '<html>',
  '<head>',
  '<style>',
  '  body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; color: #1e293b; }',
  '  .card { padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); background: linear-gradient(135deg, #f8fafc, #e2e8f0); text-align: center; border: 1px solid #cbd5e1; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }',
  '  .card:hover { transform: translateY(-5px) scale(1.02); }',
  '  h1 { margin: 0 0 0.5rem; color: #0f172a; font-size: 1.5rem; }',
  '  p { margin: 0; color: #64748b; }',
  '  .pulse { color: #3b82f6; font-weight: bold; animation: pulse 2s infinite; }',
  '  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }',
  '<' + '/style>',
  '<' + '/head>',
  '<body>',
  '  <div class="card">',
  '    <h1>Visualizador <span class="pulse">HTML<' + '/span><' + '/h1>',
  '    <p>Renderizando en tiempo real.<' + '/p>',
  '  <' + '/div>',
  '<' + '/body>',
  '<' + '/html>'
].join('\n');

/* =========================================================
   SISTEMA DE RENDERIZADO
   ========================================================= */
let renderTimeout;

const renderHTML = () => {
  const code = dom.editor.value;
  dom.iframe.srcdoc = code;
};

const handleInput = () => {
  if (!dom.toggleAuto.checked) return;
  clearTimeout(renderTimeout);
  renderTimeout = setTimeout(renderHTML, 300); // Debounce de 300ms
};

// Insertar Tabulaciones en el editor
dom.editor.addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    const end = this.selectionEnd;
    this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
    this.selectionStart = this.selectionEnd = start + 2;
    handleInput();
  }
});

dom.editor.addEventListener('input', handleInput);
if (dom.btnForceRender) dom.btnForceRender.addEventListener('click', renderHTML);

/* =========================================================
   ACCIONES DEL EDITOR
   ========================================================= */
dom.btnClear.addEventListener('click', () => {
  if(confirm('¿Purgar el lienzo actual? Se borrará todo el código.')) {
    dom.editor.value = '';
    renderHTML();
    dom.editor.focus();
  }
});

dom.btnCopy.addEventListener('click', async () => {
  const code = dom.editor.value;
  if (!code) return showToast('El editor está vacío', 'warning');
  
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(code);
    } else {
      const ta = document.createElement('textarea');
      ta.value = code;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    showToast('Código copiado al portapapeles');
  } catch (_) {
    showToast('Error al copiar', 'warning');
  }
});

/* =========================================================
   PANTALLA COMPLETA
   ========================================================= */
dom.btnFullscreen.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    dom.iframeContainer.requestFullscreen().catch(err => {
      showToast('Error al intentar abrir en pantalla completa', 'warning');
    });
  } else {
    document.exitFullscreen();
  }
});

// Escuchar cambios de estado para actualizar el icono
document.addEventListener('fullscreenchange', () => {
  const icon = dom.btnFullscreen.querySelector('i');
  if (document.fullscreenElement) {
    icon.classList.remove('fa-expand');
    icon.classList.add('fa-compress');
    dom.btnFullscreen.title = "Salir de Pantalla Completa";
  } else {
    icon.classList.remove('fa-compress');
    icon.classList.add('fa-expand');
    dom.btnFullscreen.title = "Pantalla Completa";
  }
});

/* =========================================================
   TOASTS
   ========================================================= */
function showToast(msg, type = 'success') {
  const toast = document.createElement('div');
  const palette = type === 'warning'
    ? 'bg-amber-950/90 text-amber-200 border-amber-800'
    : 'bg-slate-900/95 text-slate-100 border-slate-700';

  toast.className = `toast-popup toast-hidden px-4 py-2.5 rounded-xl shadow-2xl border text-xs font-semibold flex items-center space-x-2 ${palette}`;
  const icon = type === 'warning'
    ? '<i class="fa-solid fa-triangle-exclamation text-amber-400" aria-hidden="true"></i>'
    : '<i class="fa-solid fa-circle-check text-cyan-400" aria-hidden="true"></i>';

  toast.innerHTML = `${icon}<span>${msg}</span>`;
  dom.toastBox.appendChild(toast);
  
  requestAnimationFrame(() => {
    toast.classList.remove('toast-hidden');
    toast.classList.add('toast-visible');
  });

  setTimeout(() => {
    toast.classList.remove('toast-visible');
    toast.classList.add('toast-hidden');
    setTimeout(() => toast.remove(), 300);
  }, 2400);
}

/* =========================================================
   INIT
   ========================================================= */
dom.editor.value = defaultTemplate;
renderHTML();

})();
</script>
</body>
</html>
