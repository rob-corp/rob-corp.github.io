<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f172a">
<title>Codigo de colores fusibles</title>
<link rel="icon" type="image/svg+xml" href="iconos/union.svg">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          navyBg: '#0f172a',
          navyCard: '#1e293b',
          navyBorder: '#334155',
          cyanAccent: '#3b82f6',
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['JetBrains Mono', 'Consolas', 'Monaco', 'monospace'],
        }
      }
    }
  };
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid #3b82f6;
    outline-offset: 2px;
    border-radius: 12px; 
  }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

  /* Efecto de resplandor sutil para las tarjetas */
  .fuse-card:hover {
    box-shadow: 0 10px 25px -5px var(--tw-shadow-color);
  }
</style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ESQB0M5W6R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ESQB0M5W6R');
</script>
<body class="bg-[#0f172a] text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-[#3b82f6] selection:text-[#0f172a]">

<header class="bg-[#0f172a] border-b border-[#334155] sticky top-0 z-50 px-4 py-3.5 sm:px-8 shadow-lg shadow-black/30">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <a href="/index.html" class="inline-flex items-center gap-3.5 group">
      <div class="w-10 h-10 flex items-center justify-center bg-[#1e293b] border border-[#3b82f6]/60 rounded-xl p-1.5 transition-colors group-hover:border-[#3b82f6]">
        <img src="iconos/union.svg" alt="" class="w-full h-full object-contain" aria-hidden="true" width="40" height="40">
      </div>
      <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white group-hover:text-[#60a5fa] transition-colors">
        Codigo de colores fusibles
      </h1>
    </a>
  </div>
</header>

<main class="flex-grow w-full max-w-[1200px] mx-auto px-4 py-8 sm:px-8 flex flex-col items-center">

  <div class="w-full bg-[#1e293b] border border-[#334155] rounded-3xl p-6 sm:p-8 shadow-2xl shadow-black/40 flex flex-col gap-6">
    
    <!-- Cabecera y Buscador -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 border-b border-[#334155] pb-6">
      <div>
        <h2 class="text-sm font-bold text-[#60a5fa] uppercase tracking-widest">Estándar Automotriz (ATO/ATC)</h2>
        <p class="text-xs text-slate-400 mt-1">Busca por amperaje o color para identificar el fusible correcto.</p>
      </div>
      
      <div class="relative w-full md:w-80">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <input type="text" id="search-fuse" placeholder="Ej: 10, Rojo, Azul..." class="w-full bg-[#0f172a] border border-[#334155] rounded-xl pl-10 pr-4 py-2.5 text-white font-sans text-sm focus:border-[#3b82f6] transition-colors outline-none placeholder:text-slate-500">
      </div>
    </div>

    <!-- Grilla de Fusibles -->
    <div id="fuse-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
      <!-- Inyectado por JS para mantener el HTML limpio y facilitar el filtrado -->
    </div>

    <!-- Estado vacío -->
    <div id="empty-state" class="hidden flex-col items-center justify-center py-12 opacity-50">
      <svg class="w-12 h-12 text-slate-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <p class="text-sm font-medium text-slate-400">No se encontró ningún fusible con ese criterio.</p>
    </div>

  </div>
</main>

<script>
(() => {
  'use strict';

  /* 
   * Base de datos estática de fusibles estándar.
   * Se utiliza JS para renderizar la grilla y permitir filtrado instantáneo en el cliente
   * sin necesidad de recargar la página o hacer peticiones de red.
   */
  const fuses = [
    { amp: 1, colorName: 'Negro', hex: '#262626', textColor: '#ffffff' },
    { amp: 2, colorName: 'Gris', hex: '#9ca3af', textColor: '#0f172a' },
    { amp: 3, colorName: 'Violeta', hex: '#8b5cf6', textColor: '#ffffff' },
    { amp: 4, colorName: 'Rosa', hex: '#f472b6', textColor: '#0f172a' },
    { amp: 5, colorName: 'Beige', hex: '#d4a373', textColor: '#0f172a' },
    { amp: 7.5, colorName: 'Marrón', hex: '#92400e', textColor: '#ffffff' },
    { amp: 10, colorName: 'Rojo', hex: '#ef4444', textColor: '#ffffff' },
    { amp: 15, colorName: 'Azul', hex: '#3b82f6', textColor: '#ffffff' },
    { amp: 20, colorName: 'Amarillo', hex: '#eab308', textColor: '#0f172a' },
    { amp: 25, colorName: 'Blanco', hex: '#f8fafc', textColor: '#0f172a' },
    { amp: 30, colorName: 'Verde', hex: '#22c55e', textColor: '#ffffff' },
    { amp: 40, colorName: 'Naranja', hex: '#f97316', textColor: '#0f172a' }
  ];

  const grid = document.getElementById('fuse-grid');
  const searchInput = document.getElementById('search-fuse');
  const emptyState = document.getElementById('empty-state');

  // Convierte un color HEX a RGBA para aplicar opacidad en los fondos dinámicos
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function renderFuses(filterText = '') {
    const term = filterText.toLowerCase().trim();
    
    const filtered = fuses.filter(f => 
      f.colorName.toLowerCase().includes(term) || 
      f.amp.toString().includes(term) ||
      (term === 'transparente' && f.amp === 25) // Alias común para el blanco de 25A
    );

    if (filtered.length === 0) {
      grid.innerHTML = '';
      emptyState.classList.remove('hidden');
      emptyState.classList.add('flex');
      return;
    }

    emptyState.classList.add('hidden');
    emptyState.classList.remove('flex');

    const fragment = document.createDocumentFragment();

    filtered.forEach(fuse => {
      const card = document.createElement('div');
      // Variables CSS en línea para no contaminar el DOM con clases dinámicas arbitrarias de Tailwind
      card.className = 'fuse-card flex flex-col items-center justify-center p-4 rounded-xl border-2 transition-all cursor-default';
      card.style.borderColor = fuse.hex;
      card.style.backgroundColor = hexToRgba(fuse.hex, 0.08);
      card.style.setProperty('--tw-shadow-color', hexToRgba(fuse.hex, 0.4));

      card.innerHTML = `
        <div class="w-14 h-14 rounded-xl mb-3 flex items-center justify-center shadow-lg" style="background-color: ${fuse.hex};">
          <span class="font-mono font-black text-xl tracking-tighter" style="color: ${fuse.textColor};">${fuse.amp}A</span>
        </div>
        <span class="text-white font-bold text-xs uppercase tracking-wider">${fuse.colorName}</span>
      `;
      fragment.appendChild(card);
    });

    grid.innerHTML = '';
    grid.appendChild(fragment);
  }

  // Delegación del evento de búsqueda (debounce no es necesario para arreglos pequeños locales)
  searchInput.addEventListener('input', (e) => {
    renderFuses(e.target.value);
  });

  // Inicialización
  renderFuses();

})();
</script>
</body>
</html>
