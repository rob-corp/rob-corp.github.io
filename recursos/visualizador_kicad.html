<!DOCTYPE html>
<html lang="es" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f172a">
<title>Lector KiCad</title>

<!-- Favicon apuntando a tu archivo de icono -->
<link id="favicon" rel="icon" type="image/svg+xml" href="/iconos/kicad.svg">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Motor KiCanvas (Ruta Oficial Correcta) -->
<script type="module" src="https://kicanvas.org/kicanvas/kicanvas.js"></script>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          slate: { 950: '#0f172a', 900: '#1e293b', 800: '#334155', 700: '#475569' },
          cyan: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' },
        }
      }
    }
  };
</script>

<style>
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
  html { scrollbar-color: #334155 #0f172a; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  kicanvas-embed {
    width: 100%;
    height: 100%;
    outline: none;
  }
</style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ESQB0M5W6R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ESQB0M5W6R');
</script><body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col overflow-hidden">

<!-- HEADER -->
<header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-30 flex-shrink-0">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    
    <!-- Título y Logo dependiente del archivo -->
    <a href="/index.html" class="flex items-center space-x-3 group rounded-xl p-1 transition-all" title="Ir a inicio">
      <img src="/iconos/kicad.svg" alt="" class="w-8 h-8 group-hover:scale-105 transition-transform duration-200" aria-hidden="true">
      <h1 class="text-xl font-extrabold text-white tracking-tight group-hover:text-cyan-300 transition-colors">Lector KiCad</h1>
    </a>

    <div class="hidden sm:flex items-center space-x-2 text-xs text-slate-400 bg-slate-950/60 px-3 py-1.5 rounded-full border border-slate-800">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
      <span class="font-medium text-slate-300">Motor WebGL Activo</span>
    </div>
  </div>
</header>

<!-- LAYOUT PRINCIPAL -->
<main class="flex-1 flex flex-col md:flex-row w-full h-[calc(100vh-4rem)] overflow-hidden">
  
  <!-- PANEL LATERAL -->
  <aside class="w-full md:w-80 bg-slate-900 border-r border-slate-800 flex flex-col flex-shrink-0 z-10 overflow-y-auto">
    <div class="p-4 space-y-4">
      
      <!-- ZONA DE CARGA -->
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 shadow-inner">
        <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Cargar Archivo</h2>
        <label id="drop-zone" class="border-2 border-dashed border-slate-700 hover:border-cyan-500 bg-slate-900 hover:bg-slate-800 transition-all rounded-lg min-h-[100px] flex flex-col items-center justify-center p-4 cursor-pointer group">
          <i class="fa-solid fa-file-import text-2xl text-slate-500 group-hover:text-cyan-400 mb-2 transition-colors"></i>
          <span class="text-xs font-semibold text-slate-300 text-center">Selecciona o arrastra tu archivo</span>
          <span class="text-[10px] text-slate-500 mt-1">.kicad_sch o .kicad_pcb</span>
          <input type="file" id="file-input" accept=".kicad_sch,.kicad_pcb" class="hidden">
        </label>
      </div>

      <!-- INFORMACIÓN DEL ARCHIVO -->
      <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 shadow-inner space-y-2">
        <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Detalles del Proyecto</h2>
        <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
          <span class="text-[11px] text-slate-500">Nombre:</span>
          <span id="info-name" class="text-[11px] font-mono font-bold text-slate-200 truncate max-w-[150px]">—</span>
        </div>
        <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
          <span class="text-[11px] text-slate-500">Tipo:</span>
          <span id="info-type" class="text-[11px] font-mono font-bold text-cyan-400">—</span>
        </div>
        <div class="flex justify-between items-center pb-1">
          <span class="text-[11px] text-slate-500">Tamaño:</span>
          <span id="info-size" class="text-[11px] font-mono font-bold text-slate-200">—</span>
        </div>
      </div>

      <!-- CONTROLES EXTRA (Guía) -->
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
        <h3 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2"><i class="fa-solid fa-keyboard mr-1.5"></i>Controles</h3>
        <ul class="text-[10px] text-slate-400 space-y-1.5 ml-1">
          <li>• <strong class="text-slate-300">Rueda del ratón:</strong> Zoom In/Out</li>
          <li>• <strong class="text-slate-300">Clic Izquierdo + Arrastrar:</strong> Desplazar</li>
          <li>• <strong class="text-slate-300">Panel inferior:</strong> Gestión de Capas</li>
        </ul>
      </div>

    </div>
  </aside>

  <!-- CONTENEDOR DEL VISOR (KiCanvas) -->
  <div class="flex-1 relative bg-[#0f172a] shadow-inner overflow-hidden flex items-center justify-center" id="viewer-container">
    
    <!-- Estado vacío -->
    <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-10 transition-opacity">
      <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-3 shadow-xl">
        <i class="fa-solid fa-route text-3xl text-slate-600"></i>
      </div>
      <p class="text-sm font-bold text-slate-400">Esperando archivo KiCad...</p>
    </div>

    <!-- Indicador de Carga -->
    <div id="loading-state" class="absolute inset-0 flex flex-col items-center justify-center z-20 bg-[#0f172a]/80 backdrop-blur-sm hidden">
      <i class="fa-solid fa-circle-notch fa-spin text-4xl text-cyan-500 mb-3"></i>
      <p class="text-xs font-bold text-slate-300 uppercase tracking-widest">Renderizando Diseño...</p>
    </div>
    
  </div>

</main>

<script>
(() => {
  'use strict';

  const dom = {
    fileInput: document.getElementById('file-input'),
    dropZone: document.getElementById('drop-zone'),
    viewerContainer: document.getElementById('viewer-container'),
    emptyState: document.getElementById('empty-state'),
    loadingState: document.getElementById('loading-state'),
    infoName: document.getElementById('info-name'),
    infoType: document.getElementById('info-type'),
    infoSize: document.getElementById('info-size')
  };

  const formatBytes = (bytes) => {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  };

  const loadFile = (file) => {
    if (!file) return;

    const ext = file.name.split('.').pop().toLowerCase();
    if (ext !== 'kicad_sch' && ext !== 'kicad_pcb') {
      alert('Por favor, selecciona un archivo válido de KiCad (.kicad_sch o .kicad_pcb)');
      return;
    }

    // Actualizar Textos
    dom.infoName.textContent = file.name;
    dom.infoName.title = file.name;
    dom.infoType.textContent = ext === 'kicad_sch' ? 'Esquema (SCH)' : 'Placa (PCB)';
    dom.infoSize.textContent = formatBytes(file.size);

    if (dom.emptyState) dom.emptyState.classList.add('hidden');
    dom.loadingState.classList.remove('hidden');
    
    // Limpiar visor anterior si existe
    const oldCanvas = document.getElementById('kicad-viewer');
    if (oldCanvas) oldCanvas.remove();

    // Leer el archivo como texto plano
    const reader = new FileReader();
    
    reader.onload = (e) => {
      const fileContent = e.target.result;
      const type = ext === 'kicad_pcb' ? 'board' : 'schematic';

      // Se construye con el parser (template) y no con createElement():
      // evita el error "custom element must not have attributes".
      const tpl = document.createElement('template');
      tpl.innerHTML =
        '<kicanvas-embed id="kicad-viewer" controls="full" controlslist="nooverlay" theme="kicad" ' +
        'class="opacity-0 transition-opacity duration-700 z-0 w-full h-full">' +
        '<kicanvas-source></kicanvas-source></kicanvas-embed>';
      const newViewer = tpl.content.firstElementChild;

      // El contenido entra como texto plano: no hay nada que escapar
      const source = newViewer.querySelector('kicanvas-source');
      source.setAttribute('type', type);
      source.setAttribute('name', file.name);
      source.textContent = fileContent;

      dom.viewerContainer.appendChild(newViewer);
      
      // Le damos un respiro al Web Worker de KiCanvas para que parsee los nodos
      setTimeout(() => {
        dom.loadingState.classList.add('hidden');
        newViewer.classList.remove('opacity-0');
        newViewer.classList.add('opacity-100');
      }, 1500);
    };
    
    reader.onerror = () => {
      dom.loadingState.classList.add('hidden');
      if (dom.emptyState) dom.emptyState.classList.remove('hidden');
      alert('No se pudo leer el archivo seleccionado.');
    };

    reader.readAsText(file);
  };

  /* =========================================================
     EVENTOS DE INTERACCIÓN
     ========================================================= */
  dom.fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) loadFile(e.target.files[0]);
    e.target.value = ''; // permite volver a seleccionar el mismo archivo
  });

  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    document.body.addEventListener(eventName, (e) => e.preventDefault(), false);
  });

  dom.dropZone.addEventListener('dragover', () => dom.dropZone.classList.add('border-cyan-500', 'bg-slate-800'));
  dom.dropZone.addEventListener('dragleave', () => dom.dropZone.classList.remove('border-cyan-500', 'bg-slate-800'));
  dom.dropZone.addEventListener('drop', (e) => {
    dom.dropZone.classList.remove('border-cyan-500', 'bg-slate-800');
    if (e.dataTransfer.files.length > 0) loadFile(e.dataTransfer.files[0]);
  });

})();
</script>
</body>
</html>
