<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f172a">
<title>Calculadora Diodo Zener</title>
<link rel="icon" type="image/svg+xml" href="iconos/zener.svg">

<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          mono: ['JetBrains Mono', 'Consolas', 'monospace'],
        },
        colors: {
          slate: {
            600: '#475569',
            700: '#334155',
            800: '#334155',
            850: '#1e293b',
            900: '#1e293b',
            950: '#0f172a'
          },
          cyan: {
            300: '#93c5fd',
            400: '#60a5fa',
            500: '#3b82f6',
            600: '#2563eb',
            700: '#1d4ed8'
          }
        }
      }
    }
  };
</script>

<style>
  /* Reseteo estricto de UI táctil y de foco */
  *, *::before, *::after, a, button, input { 
      -webkit-tap-highlight-color: transparent !important; 
  }
  
  :focus { outline: none !important; box-shadow: none !important; }
  :focus-visible { 
      outline: 2px solid #3b82f6 !important; 
      outline-offset: 2px !important; 
      border-radius: 8px; 
  }
  
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  /* Scrollbars - Tema Oscuro */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  /* Ocultar flechas en inputs numéricos */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none; appearance: none; margin: 0;
  }
  input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  select { -webkit-appearance: none; -moz-appearance: none; appearance: none; }

  /* Estilos para inputs calculados (Solo lectura) */
  input:disabled, input[readonly] {
    background-color: #1e293b;
    color: #60a5fa;
    border-color: #3b82f6;
    opacity: 1;
    box-shadow: inset 0 2px 4px 0 rgb(0 0 0 / 0.15);
  }
</style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ESQB0M5W6R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ESQB0M5W6R');
</script>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-white flex flex-col">

<!-- ==================== HEADER ==================== -->
<header class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-2">
    <a href="index.html" class="flex items-center space-x-3 group p-1 rounded-lg min-w-0 transition-transform active:scale-95">
      <div class="relative flex items-center justify-center w-8 h-8 rounded-lg bg-slate-950 border border-cyan-500/40 group-hover:border-cyan-400 group-hover:shadow-[0_0_12px_rgba(59,130,246,0.4)] transition-all flex-shrink-0">
        <img src="iconos/zener.svg" alt="Zener" class="w-5 h-5 object-contain filter drop-shadow-[0_0_5px_rgba(59,130,246,0.6)]" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%2360a5fa\' stroke-width=\'2\'><path d=\'M12 2v20M8 7h8l-8 10h8\'/></svg>';">
      </div>
      <h1 class="text-lg sm:text-2xl font-extrabold text-white tracking-tight group-hover:text-cyan-300 transition-colors truncate">
        Calculadora Diodo Zener
      </h1>
    </a>
  </div>
</header>

<main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:py-8 space-y-6">

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- LADO IZQUIERDO: Controles -->
    <div class="lg:col-span-5 space-y-6">
      
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-2xl space-y-5 flex flex-col">
        <div class="flex items-center space-x-2 border-b border-slate-800 pb-3">
          <i class="fa-solid fa-sliders text-cyan-400" aria-hidden="true"></i>
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-200">
            Parámetros del Circuito
          </h2>
        </div>
  
        <!-- Selector de Modo -->
        <div class="space-y-1.5">
          <label for="calc-mode" class="text-[11px] font-extrabold text-slate-400 uppercase">¿Qué dato deseas calcular?</label>
          <div class="relative">
            <select id="calc-mode" class="w-full bg-slate-950 border border-slate-800 rounded-2xl px-4 py-2.5 text-xs font-bold text-white focus:border-cyan-500 transition-all shadow-inner appearance-none cursor-pointer">
              <option value="rs">Calcular Resistencia Serie (Rs)</option>
              <option value="iz">Calcular Corriente del Zener (Iz)</option>
              <option value="il">Calcular Corriente de Carga (Carga)</option>
            </select>
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-400">
              <i class="fa-solid fa-chevron-down text-xs"></i>
            </div>
          </div>
        </div>
  
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <!-- Vin (Siempre Editable) -->
          <div class="space-y-1.5">
            <label for="val-vin" class="text-[11px] font-extrabold text-slate-400 uppercase">Voltaje Entrada</label>
            <div class="relative">
              <input type="number" id="val-vin" step="0.1" value="12" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-3 pr-8 py-2 text-sm font-mono text-white focus:border-cyan-500 transition-all shadow-inner">
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 font-mono text-xs font-bold">V</span>
            </div>
          </div>
  
          <!-- Vz -->
          <div class="space-y-1.5">
            <label for="val-vz" class="text-[11px] font-extrabold text-slate-400 uppercase">Voltaje Zener</label>
            <div class="relative">
              <input type="number" id="val-vz" step="0.1" value="5.1" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-3 pr-8 py-2 text-sm font-mono text-white focus:border-cyan-500 transition-all shadow-inner">
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 font-mono text-xs font-bold">V</span>
            </div>
          </div>
  
          <!-- Rs -->
          <div class="space-y-1.5">
            <label for="val-rs" id="lbl-rs" class="text-[11px] font-extrabold text-slate-400 uppercase transition-colors">Resistencia (Rs)</label>
            <div class="relative">
              <input type="number" id="val-rs" step="0.1" value="98.57" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-3 pr-8 py-2 text-sm font-mono text-white focus:border-cyan-500 transition-all shadow-inner">
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 font-mono text-xs font-bold">Ω</span>
            </div>
          </div>
  
          <!-- Iz -->
          <div class="space-y-1.5">
            <label for="val-iz" id="lbl-iz" class="text-[11px] font-extrabold text-slate-400 uppercase transition-colors">Corriente (Iz)</label>
            <div class="relative">
              <input type="number" id="val-iz" step="0.1" value="20" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-3 pr-8 py-2 text-sm font-mono text-white focus:border-cyan-500 transition-all shadow-inner">
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 font-mono text-xs font-bold">mA</span>
            </div>
          </div>
  
          <!-- IL -->
          <div class="space-y-1.5 sm:col-span-2">
            <label for="val-il" id="lbl-il" class="text-[11px] font-extrabold text-slate-400 uppercase transition-colors">Corriente de Carga</label>
            <div class="relative">
              <input type="number" id="val-il" step="0.1" value="50" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-3 pr-8 py-2 text-sm font-mono text-white focus:border-cyan-500 transition-all shadow-inner">
              <span class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-500 font-mono text-xs font-bold">mA</span>
            </div>
          </div>
        </div>
        
        <!-- Alertas de estado -->
        <div id="alert-box" class="hidden p-3.5 rounded-xl border items-center gap-3 text-xs transition-all bg-amber-950/40 border-amber-800/80 text-amber-300 mt-auto shadow-inner">
          <i class="fa-solid fa-triangle-exclamation text-amber-400 text-lg"></i>
          <span id="alert-text" class="font-semibold leading-relaxed"></span>
        </div>
      </section>

    </div>

    <!-- LADO DERECHO: Esquema y Resultados -->
    <div class="lg:col-span-7 space-y-6">
      
      <!-- ESQUEMA ZENER SVG -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-2xl flex flex-col items-center justify-center relative overflow-hidden">
        <div class="absolute top-0 right-0 w-64 h-64 bg-cyan-600/5 rounded-full blur-3xl pointer-events-none"></div>

        <div class="flex items-center justify-between w-full mb-4 border-b border-slate-800 pb-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400"><i class="fa-solid fa-diagram-project mr-2"></i>Esquema del Circuito</h2>
        </div>
        
        <div class="w-full flex justify-center overflow-x-auto relative">
            <svg viewBox="0 0 500 280" class="w-full max-w-[500px] h-auto select-none" aria-label="Circuito regulador de voltaje Zener">
                <!-- ==================== CABLES ==================== -->
                <!-- Vin Superior a Rs -->
                <polyline points="60,80 120,80" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
                <!-- Rs a Nodos y Carga -->
                <polyline points="204,80 270,80 380,80" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
                <!-- GND Inferior completo -->
                <polyline points="60,200 270,200 380,200" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

                <!-- ==================== NODOS ==================== -->
                <!-- Terminales abiertos Izquierda -->
                <circle cx="56" cy="80" r="4" fill="none" stroke="#3b82f6" stroke-width="2.5" />
                <circle cx="56" cy="200" r="4" fill="none" stroke="#3b82f6" stroke-width="2.5" />
                
                <!-- Nodos de empalme T -->
                <circle cx="270" cy="80" r="4" fill="#3b82f6" />
                <circle cx="270" cy="200" r="4" fill="#3b82f6" />

                <!-- ==================== RESISTENCIA (Zigzag exacto) ==================== -->
                <!-- Picos precisos: 3 arriba, 3 abajo -->
                <polyline points="120,80 127,60 141,100 155,60 169,100 183,60 197,100 204,80" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="miter"/>
                
                <!-- ==================== DIODO ZENER ==================== -->
                <!-- Cables verticales Zener -->
                <line x1="270" y1="80" x2="270" y2="110" stroke="#3b82f6" stroke-width="2.5"/>
                <line x1="270" y1="170" x2="270" y2="200" stroke="#3b82f6" stroke-width="2.5"/>
                <!-- Triángulo Anodo -->
                <polygon points="250,170 290,170 270,110" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
                <!-- Barra Catodo Z (Wings) -->
                <polyline points="250,120 250,110 290,110 290,100" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

                <!-- ==================== CARGA ==================== -->
                <!-- Cables verticales Carga -->
                <line x1="380" y1="80" x2="380" y2="100" stroke="#3b82f6" stroke-width="2.5"/>
                <line x1="380" y1="180" x2="380" y2="200" stroke="#3b82f6" stroke-width="2.5"/>
                <!-- Rectángulo limpio -->
                <rect x="360" y="100" width="40" height="80" fill="none" stroke="#3b82f6" stroke-width="2.5"/>

                <!-- ==================== TEXTOS ESTÁTICOS (Azul Claro) ==================== -->
                <text x="50" y="65" font-family="'JetBrains Mono', monospace" font-size="16" fill="#93c5fd" font-weight="bold">+ Vin</text>
                <text x="50" y="225" font-family="'JetBrains Mono', monospace" font-size="16" fill="#93c5fd" font-weight="bold">- GND</text>
                
                <text x="162" y="55" font-family="'JetBrains Mono', monospace" font-size="16" fill="#93c5fd" font-weight="bold" text-anchor="middle">Rs</text>
                <text x="235" y="145" font-family="'JetBrains Mono', monospace" font-size="15" fill="#93c5fd" font-weight="bold" text-anchor="end">Vz</text>
                
                <text x="415" y="125" font-family="'JetBrains Mono', monospace" font-size="16" fill="#93c5fd" font-weight="bold">Carga</text>

                <!-- ==================== TEXTOS DINÁMICOS (Gris Plata / Azul) ==================== -->
                <text x="60" y="145" id="svg-vin" font-family="'JetBrains Mono', monospace" font-size="16" fill="#cbd5e1" font-weight="bold">12.00V</text>
                
                <text x="162" y="125" id="svg-rs" font-family="'JetBrains Mono', monospace" font-size="16" fill="#cbd5e1" font-weight="bold" text-anchor="middle">98.57Ω</text>
                
                <text x="300" y="145" id="svg-iz" font-family="'JetBrains Mono', monospace" font-size="15" fill="#cbd5e1" font-weight="bold">20.00mA</text>
                
                <text x="415" y="150" id="svg-il" font-family="'JetBrains Mono', monospace" font-size="14" fill="#cbd5e1" font-weight="bold">50.00mA</text>
                
                <text x="415" y="175" id="svg-vz" font-family="'JetBrains Mono', monospace" font-size="15" fill="#60a5fa" font-weight="bold">5.10V</text>
            </svg>
        </div>
      </section>

      <!-- SECCIÓN RESULTADOS POTENCIA -->
      <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 border-b border-slate-800 pb-2 mb-4">
          Análisis de Potencia
        </h2>
        
        <div class="grid grid-cols-2 gap-4">
            
            <!-- Potencia Resistencia -->
            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center justify-center text-center shadow-inner relative overflow-hidden group">
                <i class="fa-solid fa-fire absolute -right-3 -bottom-3 text-5xl text-amber-500/10 group-hover:text-amber-500/20 transition-colors"></i>
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-1 z-10">Potencia Rs (Pr)</span>
                <span id="out-pr" class="text-2xl font-black font-mono text-cyan-400 z-10">0.48 W</span>
                <div class="mt-2 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 z-10">
                    <span id="out-pr-rec" class="text-[10px] text-slate-300 font-mono font-bold">Comercial: 1 W</span>
                </div>
            </div>

            <!-- Potencia Zener -->
            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col items-center justify-center text-center shadow-inner relative overflow-hidden group">
                <i class="fa-solid fa-microchip absolute -right-2 -bottom-2 text-5xl text-rose-500/10 group-hover:text-rose-500/20 transition-colors"></i>
                <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wide mb-1 z-10">Potencia Zener (Pz)</span>
                <span id="out-pz" class="text-2xl font-black font-mono text-cyan-400 z-10">0.10 W</span>
                <div class="mt-2 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 z-10">
                    <span id="out-pz-rec" class="text-[10px] text-slate-300 font-mono font-bold">Comercial: 1/4 W</span>
                </div>
            </div>

        </div>
      </section>

    </div>
  </div>
</main>

<script>
(() => {
    'use strict';

    const els = {
        mode: document.getElementById('calc-mode'),
        vin: document.getElementById('val-vin'),
        vz: document.getElementById('val-vz'),
        rs: document.getElementById('val-rs'),
        iz: document.getElementById('val-iz'),
        il: document.getElementById('val-il'),
        
        lblRs: document.getElementById('lbl-rs'),
        lblIz: document.getElementById('lbl-iz'),
        lblIl: document.getElementById('lbl-il'),
        
        alertBox: document.getElementById('alert-box'),
        alertText: document.getElementById('alert-text'),
        
        outPr: document.getElementById('out-pr'),
        outPrRec: document.getElementById('out-pr-rec'),
        outPz: document.getElementById('out-pz'),
        outPzRec: document.getElementById('out-pz-rec'),
        
        svgVin: document.getElementById('svg-vin'),
        svgVz: document.getElementById('svg-vz'),
        svgRs: document.getElementById('svg-rs'),
        svgIz: document.getElementById('svg-iz'),
        svgIl: document.getElementById('svg-il')
    };

    // Valores Comerciales sugeridos para potencias en Watts
    const commercialPowers = [0.125, 0.25, 0.5, 1, 2, 3, 5, 10];
    function getSuggestedPower(watts) {
        if(watts <= 0) return "--";
        // Sugerencia segura: al menos 50% de margen
        const target = watts * 1.5; 
        for(let p of commercialPowers) {
            if(p >= target) {
                if(p === 0.125) return "1/8 W";
                if(p === 0.25) return "1/4 W";
                if(p === 0.5) return "1/2 W";
                return `${p} W`;
            }
        }
        return `> 10 W`;
    }

    function formatNumber(num) {
        if(!isFinite(num) || isNaN(num)) return "---";
        return num.toFixed(2);
    }

    function showAlert(msg) {
        if(msg) {
            els.alertText.textContent = msg;
            els.alertBox.classList.remove('hidden');
            els.alertBox.classList.add('flex');
        } else {
            els.alertBox.classList.add('hidden');
            els.alertBox.classList.remove('flex');
        }
    }

    function updateMode() {
        const mode = els.mode.value;
        
        // Reset estilos
        [els.rs, els.iz, els.il].forEach(el => {
            el.disabled = false;
        });
        [els.lblRs, els.lblIz, els.lblIl].forEach(lbl => {
            lbl.classList.remove('text-cyan-400');
        });

        let targetInput, targetLabel;
        if (mode === 'rs') { targetInput = els.rs; targetLabel = els.lblRs; }
        else if (mode === 'iz') { targetInput = els.iz; targetLabel = els.lblIz; }
        else if (mode === 'il') { targetInput = els.il; targetLabel = els.lblIl; }

        if(targetInput) {
            targetInput.disabled = true; // El input objetivo se bloquea
            targetLabel.classList.add('text-cyan-400');
        }
        
        calculate();
    }

    function calculate() {
        const mode = els.mode.value;
        const vin = parseFloat(els.vin.value) || 0;
        const vz = parseFloat(els.vz.value) || 0;
        
        let rs = parseFloat(els.rs.value) || 0;
        let iz = parseFloat(els.iz.value) || 0;
        let il = parseFloat(els.il.value) || 0;

        showAlert(null);

        // Validaciones físicas
        if (vin <= vz) {
            showAlert('El Voltaje de Entrada (Vin) debe ser mayor al Voltaje Zener (Vz) para que exista regulación.');
            els.outPr.textContent = "0.00 W"; els.outPz.textContent = "0.00 W";
            return;
        }

        // Resolución de la Ecuación Omni-direccional
        // (Vin - Vz) = Rs * (Iz + Il) / 1000  (Corrientes en mA)
        if (mode === 'rs') {
            const iTotal_A = (iz + il) / 1000; 
            if(iTotal_A > 0) {
                rs = (vin - vz) / iTotal_A;
                els.rs.value = formatNumber(rs);
            }
        } 
        else if (mode === 'iz') {
            if(rs > 0) {
                const iTotal_A = (vin - vz) / rs;
                iz = (iTotal_A * 1000) - il;
                els.iz.value = formatNumber(iz);
            }
        } 
        else if (mode === 'il') {
            if(rs > 0) {
                const iTotal_A = (vin - vz) / rs;
                il = (iTotal_A * 1000) - iz;
                els.il.value = formatNumber(il);
            }
        }

        if (iz < 0) {
            showAlert('¡Peligro de pérdida de regulación! La corriente Iz calculada es negativa. Incrementa Vin, o disminuye la Carga (IL) o la Resistencia (Rs).');
        }

        // Cálculos de Potencia (Disipación térmica)
        const currentIz_A = Math.max(0, iz) / 1000;
        const currentIl_A = Math.max(0, il) / 1000;
        
        const p_rs = Math.pow(currentIz_A + currentIl_A, 2) * rs;
        const p_zener = vz * currentIz_A;

        els.outPr.textContent = formatNumber(p_rs) + ' W';
        els.outPrRec.textContent = 'Comercial: ' + getSuggestedPower(p_rs);
        
        els.outPz.textContent = formatNumber(p_zener) + ' W';
        els.outPzRec.textContent = 'Comercial: ' + getSuggestedPower(p_zener);

        // Actualizar textos en el plano interactivo SVG
        els.svgVin.textContent = formatNumber(vin) + 'V';
        els.svgVz.textContent  = formatNumber(vz) + 'V';
        els.svgRs.textContent  = formatNumber(rs) + 'Ω';
        els.svgIz.textContent  = formatNumber(iz) + 'mA';
        els.svgIl.textContent  = formatNumber(il) + 'mA';
    }

    // Event Listeners
    els.mode.addEventListener('change', updateMode);
    [els.vin, els.vz, els.rs, els.iz, els.il].forEach(input => {
        input.addEventListener('input', calculate);
    });

    // Iniciar con cálculo de Rs
    updateMode();

})();
</script>
</body>
</html>
