<script>
(() => {
  'use strict';

  const fields = {
    v: { card: document.getElementById('card-v'), input: document.getElementById('val-v'), unit: document.getElementById('unit-v'), svg: document.getElementById('svg-v-val'), type: 'v' },
    i: { card: document.getElementById('card-i'), input: document.getElementById('val-i'), unit: document.getElementById('unit-i'), svg: document.getElementById('svg-i-val'), type: 'i' },
    r: { card: document.getElementById('card-r'), input: document.getElementById('val-r'), unit: document.getElementById('unit-r'), svg: document.getElementById('svg-r-val'), type: 'r' },
    p: { card: document.getElementById('card-p'), input: document.getElementById('val-p'), unit: document.getElementById('unit-p'), svg: document.getElementById('svg-p-val'), type: 'p' }
  };

  let activeInputs = [];

  function getBestUnit(val, type) {
    if (val === 0 || isNaN(val) || !isFinite(val)) return { val: 0, mult: 1 };
    const absVal = Math.abs(val);
    if (type === 'v') {
      if (absVal >= 1000) return { val: val / 1000, mult: 1000 };
      if (absVal > 0 && absVal < 1) return { val: val * 1000, mult: 0.001 };
      return { val: val, mult: 1 };
    }
    if (type === 'i') {
      if (absVal >= 1) return { val: val, mult: 1 };
      if (absVal >= 0.001) return { val: val * 1000, mult: 0.001 };
      if (absVal > 0) return { val: val * 1000000, mult: 0.000001 };
      return { val: val, mult: 1 };
    }
    if (type === 'r') {
      if (absVal >= 1000000) return { val: val / 1000000, mult: 1000000 };
      if (absVal >= 1000) return { val: val / 1000, mult: 1000 };
      return { val: val, mult: 1 };
    }
    if (type === 'p') {
      if (absVal >= 1000) return { val: val / 1000, mult: 1000 };
      if (absVal > 0 && absVal < 1) return { val: val * 1000, mult: 0.001 };
      return { val: val, mult: 1 };
    }
  }

  function getUnitSymbol(mult, type) {
    if (type === 'v') return mult === 1000 ? 'kV' : mult === 0.001 ? 'mV' : 'V';
    if (type === 'i') return mult === 1 ? 'A' : mult === 0.001 ? 'mA' : 'µA';
    if (type === 'r') return mult === 1000000 ? 'MΩ' : mult === 1000 ? 'kΩ' : 'Ω';
    if (type === 'p') return mult === 1000 ? 'kW' : mult === 0.001 ? 'mW' : 'W';
  }

  function getBaseValue(f) {
    const v = parseFloat(f.input.value);
    if (isNaN(v)) return null;
    return v * parseFloat(f.unit.value);
  }

  function setComputedValue(key, baseVal) {
    const f = fields[key];
    const best = getBestUnit(baseVal, key);
    f.input.value = parseFloat(best.val.toFixed(4));
    f.unit.value = best.mult;
    f.input.classList.remove('input-manual');
    f.input.classList.add('input-computed');
    f.card.querySelector('.tag-state').textContent = 'CALCULADO';
    f.svg.textContent = `${parseFloat(best.val.toFixed(2))} ${getUnitSymbol(best.mult, key)}`;
    f.svg.classList.add('text-[#f0a070]');
    if (f._syncUnit) f._syncUnit();
  }

  function setManualState(key) {
    const f = fields[key];
    f.input.classList.remove('input-computed');
    f.input.classList.add('input-manual');
    f.card.querySelector('.tag-state').textContent = 'INGRESADO';
    const v = getBaseValue(f);
    if (v !== null) {
      const best = getBestUnit(v, key);
      f.svg.textContent = `${parseFloat(best.val.toFixed(2))} ${getUnitSymbol(best.mult, key)}`;
    } else {
      f.svg.textContent = `0 ${getUnitSymbol(parseFloat(f.unit.value), key)}`;
    }
    f.svg.classList.remove('text-[#f0a070]');
  }

  function calculateOhm() {
    if (activeInputs.length < 2) return;
    const k1 = activeInputs[0];
    const k2 = activeInputs[1];
    const v1 = getBaseValue(fields[k1]);
    const v2 = getBaseValue(fields[k2]);
    if (v1 === null || v2 === null) return;

    const known = { [k1]: v1, [k2]: v2 };
    let v, i, r, p;

    if (known.v !== undefined && known.i !== undefined) {
      v = known.v; i = known.i;
      r = (i !== 0) ? v / i : 0;
      p = v * i;
    } else if (known.v !== undefined && known.r !== undefined) {
      v = known.v; r = known.r;
      i = (r !== 0) ? v / r : 0;
      p = (r !== 0) ? (v * v) / r : 0;
    } else if (known.v !== undefined && known.p !== undefined) {
      v = known.v; p = known.p;
      i = (v !== 0) ? p / v : 0;
      r = (p !== 0) ? (v * v) / p : 0;
    } else if (known.i !== undefined && known.r !== undefined) {
      i = known.i; r = known.r;
      v = i * r;
      p = i * i * r;
    } else if (known.i !== undefined && known.p !== undefined) {
      i = known.i; p = known.p;
      v = (i !== 0) ? p / i : 0;
      r = (i !== 0) ? p / (i * i) : 0;
    } else if (known.r !== undefined && known.p !== undefined) {
      r = known.r; p = known.p;
      v = Math.sqrt(p * r);
      i = (r !== 0) ? Math.sqrt(p / r) : 0;
    }

    const computedValues = { v, i, r, p };
    Object.keys(fields).forEach(key => {
      if (!activeInputs.includes(key)) setComputedValue(key, computedValues[key]);
    });
  }

  function handleInput(e, key) {
    const valStr = e.target.value;
    if (valStr === '') {
      activeInputs = activeInputs.filter(k => k !== key);
      const f = fields[key];
      f.input.classList.remove('input-computed', 'input-manual');
      f.card.querySelector('.tag-state').textContent = '';
      f.svg.textContent = `0 ${getUnitSymbol(parseFloat(f.unit.value), key)}`;
      f.svg.classList.remove('text-[#f0a070]');
      return;
    }
    if (!activeInputs.includes(key)) {
      if (activeInputs.length >= 2) activeInputs.shift();
      activeInputs.push(key);
    } else {
      activeInputs = activeInputs.filter(k => k !== key);
      activeInputs.push(key);
    }
    setManualState(key);
    if (activeInputs.length === 2) setManualState(activeInputs[0]);
    calculateOhm();
  }

  Object.keys(fields).forEach(key => {
    fields[key].input.addEventListener('input', (e) => handleInput(e, key));
    fields[key].unit.addEventListener('change', () => {
      if (activeInputs.includes(key)) {
        setManualState(key);
        calculateOhm();
      }
    });
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    activeInputs = [];
    Object.keys(fields).forEach(key => {
      const f = fields[key];
      f.input.value = '';
      f.input.classList.remove('input-computed', 'input-manual');
      f.card.querySelector('.tag-state').textContent = '';
      f.svg.textContent = `0 ${getUnitSymbol(parseFloat(f.unit.value), key)}`;
      f.svg.classList.remove('text-[#f0a070]');
    });
  });

  // --- CUSTOM DROPDOWNS DE UNIDADES ---
  function setupUnitDropdowns() {
    const allMenus = () => document.querySelectorAll('[data-unit-menu]');
    const allButtons = () => document.querySelectorAll('[data-unit-btn]');

    const closeAll = () => {
      allMenus().forEach(m => m.classList.add('hidden'));
      allButtons().forEach(b => {
        b.setAttribute('aria-expanded', 'false');
        b.querySelector('svg')?.classList.remove('rotate-180');
      });
    };

    Object.keys(fields).forEach(key => {
      const btn    = document.querySelector(`[data-unit-btn="${key}"]`);
      const menu   = document.querySelector(`[data-unit-menu="${key}"]`);
      const label  = document.querySelector(`[data-unit-label="${key}"]`);
      const select = fields[key].unit;
      if (!btn || !menu || !label || !select) return;

      const options = menu.querySelectorAll('[data-unit-opt]');
      const isPower = key === 'p';

      const activeClass = isPower
        ? 'unit-opt w-full text-left px-4 py-2.5 text-base font-mono font-bold text-[#0f172a] bg-[#f0a070] rounded-xl transition-colors whitespace-nowrap shadow-sm'
        : 'unit-opt w-full text-left px-4 py-2.5 text-base font-mono font-bold text-white bg-[#3b82f6] rounded-xl transition-colors whitespace-nowrap shadow-sm';

      const idleClass = isPower
        ? 'unit-opt w-full text-left px-4 py-2.5 text-base font-mono font-semibold text-white hover:bg-[#f0a070] hover:text-[#0f172a] rounded-xl transition-colors whitespace-nowrap border border-transparent'
        : 'unit-opt w-full text-left px-4 py-2.5 text-base font-mono font-semibold text-white hover:bg-[#3b82f6] hover:text-white rounded-xl transition-colors whitespace-nowrap border border-transparent';

      const syncActive = () => {
        const currentVal = select.value;
        options.forEach(opt => {
          const isActive = opt.dataset.value === currentVal;
          opt.className = isActive ? activeClass : idleClass;
          if (isActive) label.textContent = opt.textContent.trim();
        });
      };

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = !menu.classList.contains('hidden');
        closeAll();
        if (!isOpen) {
          menu.classList.remove('hidden');
          btn.setAttribute('aria-expanded', 'true');
          btn.querySelector('svg')?.classList.add('rotate-180');
        }
      });

      options.forEach(opt => {
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          const newVal = opt.dataset.value;
          if (select.value !== newVal) {
            select.value = newVal;
            select.dispatchEvent(new Event('change'));
          }
          syncActive();
          closeAll();
        });
      });

      fields[key]._syncUnit = syncActive;
      syncActive();
    });

    document.addEventListener('click', closeAll);
  }

  setupUnitDropdowns();

})();
</script>
</body>
