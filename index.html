<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f172a">
<title>RobCorp</title>
<link rel="icon" type="image/svg+xml" href="iconos/y.r.svg" sizes="any">
<style>
  :root {
    --bg-primary: #0f172a;
    --bg-card: #1e293b;
    --bg-card-hover: #334155;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.4);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border-color: #334155;
    --radius: 12px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --tab-count: 3;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-text-size-adjust: 100%;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-primary);
    color: var(--text-main);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    flex-direction: column;
    overscroll-behavior: none;
  }

  /* ===================== CABECERA ===================== */
  header {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    padding: 1.25rem 1.25rem 0.75rem;
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }

  .brand-logo {
    width: 42px;
    height: 42px;
    object-fit: contain;
    filter: drop-shadow(0 4px 12px var(--accent-glow));
    flex-shrink: 0;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 40%, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }

  p.subtitle {
    color: var(--text-muted);
    font-size: 0.82rem;
    font-weight: 500;
    margin-top: 0.1rem;
  }

  /* ===================== PESTAÑAS ===================== */
  .tabs-wrapper {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    border-bottom: 1px solid var(--border-color);
    background-color: var(--bg-primary);
    position: relative;
    flex-shrink: 0;
  }

  .tabs-header {
    display: flex;
    width: 100%;
    position: relative;
  }

  .tab-btn {
    flex: 1;
    padding: 0.85rem 0.2rem;
    background: none;
    border: none;
    color: var(--text-muted);
    font: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color var(--transition);
    text-align: center;
    user-select: none;
    white-space: nowrap;
  }

  .tab-btn.active { color: var(--text-main); }

  .tab-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -4px;
    border-radius: 6px;
  }

  .tab-indicator {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    width: calc(100% / var(--tab-count));
    background-color: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    border-radius: 3px 3px 0 0;
    transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: transform;
  }

  /* ===================== CONTENEDOR DESLIZABLE ===================== */
  main.swipe-container {
    flex: 1;
    width: 100%;
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }

  main.swipe-container::-webkit-scrollbar { display: none; }

  .tab-page {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    justify-content: center;
    -webkit-overflow-scrolling: touch;
  }

  .grid {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    width: 100%;
    max-width: 650px;
    height: max-content;
    padding-bottom: 2rem;
  }

  /* ===================== TARJETAS ===================== */
  .tool-card {
    background-color: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 0.85rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    text-decoration: none;
    color: var(--text-main);
    transition: var(--transition);
    cursor: pointer;
    user-select: none;
    width: 100%;
  }

  .tool-card:hover {
    transform: translateY(-2px);
    border-color: rgba(59, 130, 246, 0.6);
    background-color: var(--bg-card-hover);
    box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.4);
  }

  .tool-card:active {
    transform: translateY(0);
    border-color: var(--accent);
  }

  .tool-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .card-icon {
    font-size: 1.4rem;
    width: 42px;
    height: 42px;
    background-color: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background-color var(--transition);
  }

  .card-icon img {
    width: 24px;
    height: 24px;
    object-fit: contain;
    display: block;
  }

  .tool-card:hover .card-icon {
    background-color: rgba(59, 130, 246, 0.15);
  }

  .tool-title {
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: -0.01em;
    line-height: 1.3;
    flex: 1;
    min-width: 0;
    overflow-wrap: break-word;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 2.5rem 1rem;
    border: 1px dashed var(--border-color);
    border-radius: var(--radius);
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 480px) {
    header { padding: 1rem 1rem 0.5rem; }
    .brand-logo { width: 36px; height: 36px; }
    h1 { font-size: 1.35rem; }
    p.subtitle { font-size: 0.78rem; }
    .tab-btn { font-size: 0.7rem; padding: 0.75rem 0.05rem; }
    .tab-page { padding: 0.85rem; }
    .tool-card { padding: 0.75rem 0.9rem; gap: 0.8rem; }
    .card-icon { width: 38px; height: 38px; }
    .card-icon img { width: 20px; height: 20px; }
    .tool-title { font-size: 0.88rem; }
  }

  @media (max-width: 360px) {
    .tab-btn { font-size: 0.65rem; letter-spacing: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="iconos/y.r.svg" alt="RobCorp" class="brand-logo" width="42" height="42">
      <div>
        <h1>RobCorp</h1>
        <p class="subtitle">Panel de herramientas</p>
      </div>
    </div>
  </header>

  <nav class="tabs-wrapper" aria-label="Secciones del panel">
    <div class="tabs-header" role="tablist" id="tabsHeader">
      <button class="tab-btn active" role="tab" id="tab-0" aria-selected="true"  aria-controls="panel-0" tabindex="0">Calculadoras</button>
      <button class="tab-btn"        role="tab" id="tab-1" aria-selected="false" aria-controls="panel-1" tabindex="-1">Pin-outs</button>
      <button class="tab-btn"        role="tab" id="tab-2" aria-selected="false" aria-controls="panel-2" tabindex="-1">Recursos</button>
    </div>
    <div class="tab-indicator" id="tabIndicator" aria-hidden="true"></div>
  </nav>

  <main class="swipe-container" id="swipeContainer">

    <!-- PANEL 1: CALCULADORAS -->
    <section class="tab-page" id="panel-0" role="tabpanel" aria-labelledby="tab-0">
      <div class="grid">
        <a href="presupuesto.html" class="tool-card">
          <div class="card-icon" aria-hidden="true">
            <img src="iconos/presupuestador.svg" alt="" loading="lazy" decoding="async" width="24" height="24">
          </div>
          <span class="tool-title">Presupuestador</span>
        </a>

        <a href="calculadora_resitencias.html" class="tool-card">
          <div class="card-icon" aria-hidden="true">
            <img src="iconos/omega.svg" alt="" loading="lazy" decoding="async" width="24" height="24">
          </div>
          <span class="tool-title">Calculadora de Resistencias</span>
        </a>
      </div>
    </section>

    <!-- PANEL 2: PIN-OUTS -->
    <section class="tab-page" id="panel-1" role="tabpanel" aria-labelledby="tab-1">
      <div class="grid">
            <a href="ethernet-jack-poe.html" class="tool-card">
          <div class="card-icon" aria-hidden="true">
            <img src="iconos/ethernet.svg" alt="" loading="lazy" decoding="async" width="24" height="24">
          </div>
          <span class="tool-title">Puerto Ethernet, PoE, Jack Registrado</span>
        </a>      
      </div>
    </section>

    <!-- PANEL 3: RECURSOS -->
    <section class="tab-page" id="panel-2" role="tabpanel" aria-labelledby="tab-2">
      <div class="grid">
        <a href="grados-ip.html" class="tool-card">
          <div class="card-icon" aria-hidden="true"><img src="iconos/grados-ip.svg" alt="" loading="lazy" decoding="async" width="24" height="24"></div>
          <span class="tool-title">Grados de Protección IP</span>
        </a>

        <a href="frecuencia-radio.html" class="tool-card">
          <div class="card-icon" aria-hidden="true"><img src="iconos/frecuencia.svg" alt="" loading="lazy" decoding="async" width="24" height="24"></div>
          <span class="tool-title">Frecuencias de Radio</span>
        </a>

        <a href="puertas-logicas.html" class="tool-card">
          <div class="card-icon" aria-hidden="true"><img src="iconos/puertas-logicas.svg" alt="" loading="lazy" decoding="async" width="24" height="24"></div>
          <span class="tool-title">Puertas Lógicas Booleanas</span>
        </a>

        <a href="cuentagotas.html" class="tool-card">
          <div class="card-icon" aria-hidden="true"><img src="iconos/cuentagotas.svg" alt="" loading="lazy" decoding="async" width="24" height="24"></div>
          <span class="tool-title">Cuenta Gotas</span>
        </a>

        <a href="visualizador3d.html" class="tool-card">
          <div class="card-icon" aria-hidden="true"><img src="iconos/visualizador3d.svg" alt="" loading="lazy" decoding="async" width="24" height="24"></div>
          <span class="tool-title">Visualizador 3D</span>
        </a>
      </div>
    </section>

  </main>

<script>
(() => {
  'use strict';

  const container  = document.getElementById('swipeContainer');
  const indicator  = document.getElementById('tabIndicator');
  const tabsHeader = document.getElementById('tabsHeader');
  const tabs       = Array.from(tabsHeader.querySelectorAll('.tab-btn'));
  const pages      = Array.from(container.querySelectorAll('.tab-page'));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let currentIndex = 0;
  let resizeTimer;

  /* -------- Actualiza estado visual + ARIA de las pestañas -------- */
  function updateActiveTab(index) {
    if (index === currentIndex) return;
    currentIndex = index;

    for (let i = 0; i < tabs.length; i++) {
      const isActive = i === index;
      tabs[i].classList.toggle('active', isActive);
      tabs[i].setAttribute('aria-selected', String(isActive));
      tabs[i].tabIndex = isActive ? 0 : -1;
    }
    indicator.style.transform = `translateX(${index * 100}%)`;
  }

  /* -------- Navegación programática -------- */
  function switchTab(index, focus = false) {
    const clamped = Math.max(0, Math.min(pages.length - 1, index));
    container.scrollTo({
      left: container.clientWidth * clamped,
      behavior: reduceMotion ? 'auto' : 'smooth'
    });
    updateActiveTab(clamped);
    if (focus) tabs[clamped].focus();
  }

  /* -------- Click delegado (sin onclick inline) -------- */
  tabsHeader.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn || !tabsHeader.contains(btn)) return;
    switchTab(tabs.indexOf(btn));
  });

  /* -------- Navegación por teclado en la tablist -------- */
  tabsHeader.addEventListener('keydown', (e) => {
    let next = null;
    switch (e.key) {
      case 'ArrowRight': next = (currentIndex + 1) % tabs.length; break;
      case 'ArrowLeft':  next = (currentIndex - 1 + tabs.length) % tabs.length; break;
      case 'Home':       next = 0; break;
      case 'End':        next = tabs.length - 1; break;
      default: return;
    }
    e.preventDefault();
    switchTab(next, true);
  });

  /* -------- Detección de página visible (sin listener de scroll) -------- */
  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
        updateActiveTab(pages.indexOf(entry.target));
      }
    }
  }, { root: container, threshold: 0.5 });

  pages.forEach((p) => observer.observe(p));

  /* -------- Re-anclar al rotar / redimensionar (debounced) -------- */
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      container.scrollTo({
        left: container.clientWidth * currentIndex,
        behavior: 'auto'
      });
    }, 120);
  });

})();
</script>
</body>
</html>
