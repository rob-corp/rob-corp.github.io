<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RobCorp</title>
    <link rel="icon" type="image/svg+xml" href="y.r.svg">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 2rem 1.25rem;
        }

        header, main {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(59, 130, 246, 0.3));
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            margin-top: 0.2rem;
        }

        main {
            flex: 1;
        }

        /* Lista Vertical de Módulos */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
        }

        /* Bloque Unificado Clickable Estilo ElectroDoc */
        .tool-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.9rem 1.1rem;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 1rem;
            text-decoration: none;
            color: var(--text-main);
            transition: var(--transition);
            cursor: pointer;
            user-select: none;
            width: 100%;
            overflow: hidden;
        }

        .tool-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.6);
            background-color: var(--bg-card-hover);
            box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.4);
        }

        .tool-card:active {
            transform: translateY(0);
            border-color: var(--accent);
        }

        .card-icon {
            font-size: 1.5rem;
            width: 42px;
            height: 42px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: var(--transition);
        }

        .tool-card:hover .card-icon {
            background-color: rgba(59, 130, 246, 0.15);
        }

        .tool-title {
            font-weight: 600;
            font-size: 0.98rem;
            letter-spacing: -0.01em;
            line-height: 1.3;
            flex: 1;
            min-width: 0;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* Adaptación Responsiva para Celulares Estrechos */
        @media (max-width: 480px) {
            body {
                padding: 1.25rem 0.85rem;
            }

            header {
                margin-bottom: 1.5rem;
            }

            .brand-logo {
                width: 40px;
                height: 40px;
            }

            h1 {
                font-size: 1.45rem;
            }

            .tool-card {
                padding: 0.8rem 0.95rem;
                gap: 0.85rem;
            }

            .card-icon {
                width: 38px;
                height: 38px;
                font-size: 1.25rem;
                border-radius: 8px;
            }

            .tool-title {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="y.r.svg" alt="RobCorp" class="brand-logo">
            <div>
                <h1>RobCorp</h1>
                <p class="subtitle">Panel de herramientas</p>
            </div>
        </div>
    </header>

    <main>
        <div class="grid">
            
            <a href="presupuesto.html" class="tool-card">
                <div class="card-icon">🧮</div>
                <span class="tool-title">Presupuestador</span>
            </a>

            <a href="visualizador3d.html" class="tool-card">
                <div class="card-icon">⚡</div>
                <span class="tool-title">Visualizador 3D</span>
            </a>

            <a href="cuentagotas.html" class="tool-card">
                <div class="card-icon">💨</div>
                <span class="tool-title">Cuenta Gotas</span>
            </a>

            
        </div>
    </main>

</body>
</html>
